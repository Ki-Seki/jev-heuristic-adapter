[project]
name = "jev-heuristic-adapter"
version = "0.1.0"
description = "Compile fixed decision tasks into reusable heuristic programs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.26.0",
    "platformdirs>=4.11.12",
    "referencing>=0.37.0",
    "typesafe-sdk>=0.7.1",
]

[project.optional-dependencies]
openai = ["openai>=3.19.0"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --disable-socket"

[tool.coverage.run]
branch = true
source = ["jev_heuristic_adapter"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 100
